# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment and queue newer runs until the active deploy finishes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel stale in-progress Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const activeStatuses = new Set([
              "deployment_in_progress",
              "syncing_files",
              "finished_file_sync",
              "updating_pages",
              "purging_cdn",
            ]);

            let latestCommit = "";
            try {
              const latestBuild = await github.request("GET /repos/{owner}/{repo}/pages/builds/latest", { owner, repo });
              latestCommit = latestBuild.data?.commit ?? "";
            } catch (error) {
              core.info(`No previous Pages build found (${error.status ?? "unknown"}).`);
              return;
            }

            if (!latestCommit) {
              core.info("No previous Pages build found.");
              return;
            }

            const deployment = await github.request(
              "GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}",
              { owner, repo, pages_deployment_id: latestCommit }
            );
            const status = deployment.data?.status ?? "unknown";
            if (!activeStatuses.has(status)) {
              core.info(`No in-progress Pages deployment to cancel (status: ${status}).`);
              return;
            }

            await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
              { owner, repo, pages_deployment_id: latestCommit }
            );
            core.info(`Cancelled in-progress Pages deployment ${latestCommit} (${status}).`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
