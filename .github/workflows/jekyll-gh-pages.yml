# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment and queue newer runs until the active deploy finishes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel stale in-progress Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const activeStatuses = new Set([
              "deployment_in_progress",
              "syncing_files",
              "finished_file_sync",
              "updating_pages",
              "purging_cdn",
            ]);

            let deployments = [];
            try {
              deployments = await github.paginate(
                "GET /repos/{owner}/{repo}/pages/deployments",
                { owner, repo, per_page: 100 }
              );
            } catch (error) {
              if (error.status === 404) {
                core.info(
                  "Skipping stale deployment cancellation: Pages deployments endpoint is unavailable."
                );
                return;
              }
              throw error;
            }
            const activeDeployments = deployments.filter((deployment) =>
              activeStatuses.has(deployment.status ?? "unknown")
            );
            if (activeDeployments.length === 0) {
              core.info("No in-progress Pages deployment to cancel.");
              return;
            }

            for (const deployment of activeDeployments) {
              await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                { owner, repo, pages_deployment_id: deployment.id }
              );
              core.info(
                `Cancelled in-progress Pages deployment ${deployment.id} (${deployment.status ?? "unknown"}).`
              );
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
